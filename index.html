<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR PO PRODUCTION REPORT</title>
    
    <!-- CSS & JS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- SheetJS สำหรับสร้างไฟล์ Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        /* ตั้งค่าฟอนต์อังศนานิว ขนาด 16pt และพื้นหลังสีขาว */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Angsana New', 'AngsanaUPC', Tahoma, sans-serif;
            font-size: 16pt;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        /* สำหรับการพิมพ์เอกสาร */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white; color: black; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .report-section {
                border: none !important; margin-bottom: 20px !important; padding: 0 !important;
                page-break-inside: avoid;
            }
            .prod-table { width: 100% !important; border-collapse: collapse !important; font-size: 16pt !important; }
            .prod-table th, .prod-table td { border: 1px solid #000 !important; color: black !important; padding: 4px !important; }
            .prod-table th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .highlight { color: #000 !important; font-weight: bold; }
        }

        .control-panel {
            background: #f8f9fa; border: 1px solid #dee2e6;
            border-radius: 6px; padding: 15px; margin-bottom: 20px;
        }

        .report-section {
            width: 100%; background: #ffffff;
            border: 1px solid #000000; padding: 15px; margin-bottom: 20px;
        }

        .report-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid #000000; padding-bottom: 5px; margin-bottom: 15px;
        }

        .report-title-text { font-size: 18pt; font-weight: bold; }
        .report-title-text span.highlight { color: #0d6efd; }

        .table-responsive { width: 100%; overflow-x: auto; }

        /* จัดระเบียบความกว้างตารางให้เท่ากัน */
        .prod-table {
            width: 100%; 
            border-collapse: collapse;
            border: 1px solid #000000; 
            font-size: 16pt;
            table-layout: fixed; /* บังคับให้คอลัมน์กว้างเท่ากันเป๊ะๆ */
        }

        .prod-table th, .prod-table td {
            border: 1px solid #000000; 
            padding: 6px 10px; 
            text-align: right; 
            vertical-align: middle;
            word-wrap: break-word; /* ตัดคำอัตโนมัติหากยาวเกิน */
            overflow: hidden;
        }

        .prod-table th { background-color: #f2f2f2; font-weight: bold; text-align: center; }
        
        /* ล็อคความกว้างช่องวันที่ไว้ที่ 15% */
        .prod-table th:first-child, .prod-table td:first-child { 
            width: 15%; 
            text-align: center; 
            font-weight: bold;
        }
        
        .prod-table td.col-date { background-color: #fcfcfc; }
        .prod-table tfoot th { background-color: #e9ecef; font-weight: bold; }

        .val-cell { font-weight: bold; }
        .val-zero { color: #aaaaaa; font-weight: normal; } 

        .form-control, .btn { font-size: 16pt; }
        
        .btn-custom { font-weight: bold; display: inline-flex; align-items: center; gap: 6px; padding: 6px 15px; }

        /* Dropdown ค้นหาอัจฉริยะ */
        .smart-dropdown-menu {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #ffffff; border: 1px solid #ced4da;
            border-top: none; z-index: 1000; max-height: 250px; overflow-y: auto;
            display: none; border-radius: 0 0 6px 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .smart-dropdown-item {
            padding: 8px 12px; color: #000; cursor: pointer;
            border-bottom: 1px solid #f1f1f1; font-size: 16pt;
        }
        .smart-dropdown-item:hover { background: #e9ecef; }
        .highlight-match { color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body>

    <div class="control-panel no-print">
        <div class="row align-items-end g-3">
            
            <!-- ช่องค้นหาเลขที่ PO -->
            <div class="col-md-4">
                <label class="form-label fw-bold mb-1">ระบุเลขที่ PO:</label>
                <div class="input-group position-relative">
                    <input type="text" id="input_po_no" class="form-control" 
                           placeholder="พิมพ์เลขที่ PO..." autocomplete="off"
                           onkeyup="filterPODropdown()" onfocus="filterPODropdown()" onkeydown="handleEnter(event)">
                    <button class="btn btn-primary btn-custom" onclick="fetchAndRenderReport()">
                        <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
                    </button>
                    <div id="smart_dropdown_po" class="smart-dropdown-menu"></div>
                </div>
            </div>
            
            <!-- ช่องช่วงวันที่ -->
            <div class="col-md-4">
                <label class="form-label fw-bold mb-1">ช่วงวันที่แสดงผล:</label>
                <div class="d-flex gap-2">
                    <div class="input-group">
                        <input type="date" id="input_start_date" class="form-control px-2">
                        <span class="input-group-text">-</span>
                        <input type="date" id="input_end_date" class="form-control px-2">
                    </div>
                </div>
            </div>
            
            <!-- โซนปุ่มควบคุม (ปริ้นต์ & ส่งออก) -->
            <div class="col-md-4 text-end">
                <div id="loadingStatus" class="d-inline-block text-primary me-3" style="display: none !important;">
                    <i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลด...
                </div>
                
                <button class="btn btn-success btn-custom me-2" onclick="exportToExcel()">
                    <i class="fa-solid fa-file-excel"></i> ส่งออก EXCEL
                </button>
                
                <button class="btn btn-secondary btn-custom" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> พิมพ์
                </button>
            </div>
        </div>
    </div>

    <!-- ข้อความแจ้งเตือนเริ่มต้น -->
    <div class="text-center text-muted mt-5" id="placeholderText">
        <i class="fa-solid fa-file-invoice mb-3 opacity-50" style="font-size: 3rem;"></i><br>
        กรุณาระบุเลขที่ PO และกดค้นหา เพื่อดูรายงานยอดผลิต
    </div>

    <!-- พื้นที่แสดงรายงาน (ตารางจะถูก Gen ลงในนี้) -->
    <div id="reportContainer"></div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json", "Prefer": "return=minimal" 
    };

    let rawData = { orders: [], workItems: [], steps: [], targets: [] };
    let maps = { workIdToCode: {}, stepIdToName: {}, stepIdToLevel: {}, targetIdToStepId: {}, workIdToStepIds: {} };
    let allPOs = [];

    window.onload = async function() {
        setDefaultDates(); 
        showLoading(true);
        await fetchBaseData();
        setupPOList(); 
        showLoading(false);
    };

    function setDefaultDates() {
        let today = new Date();
        let startDate = new Date();
        startDate.setDate(today.getDate() - 30); 
        
        document.getElementById('input_start_date').value = startDate.toISOString().substring(0, 10);
        document.getElementById('input_end_date').value = today.toISOString().substring(0, 10);
    }

    async function fetchBaseData() {
        try {
            const endpoints = [
                `${SUPABASE_URL}/orders?select=id_order,order_no,po_no,id_work,quantity`,
                `${SUPABASE_URL}/work_items?select=id_work,work_code`,
                `${SUPABASE_URL}/production_steps?select=id_step,step_name,level`,
                `${SUPABASE_URL}/targets?select=id_target,id_step,id_work`
            ];
            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers, cache: 'no-store' })));
            const data = await Promise.all(responses.map(res => res.json()));
            
            rawData = { orders: data[0], workItems: data[1], steps: data[2], targets: data[3] };
            buildMaps();
        } catch (error) { console.error("Error Fetching Base Data:", error); }
    }

    function buildMaps() {
        maps.workIdToCode = {}; rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);
        
        maps.stepIdToName = {}; 
        maps.stepIdToLevel = {}; 
        rawData.steps.forEach(s => {
            maps.stepIdToName[s.id_step] = s.step_name;
            maps.stepIdToLevel[s.id_step] = parseInt(s.level) || 9999; 
        });

        maps.targetIdToStepId = {}; maps.workIdToStepIds = {};
        rawData.targets.forEach(t => {
            maps.targetIdToStepId[t.id_target] = t.id_step;
            if(!maps.workIdToStepIds[t.id_work]) maps.workIdToStepIds[t.id_work] = new Set();
            maps.workIdToStepIds[t.id_work].add(t.id_step);
        });
    }

    function setupPOList() {
        let poSet = new Set();
        rawData.orders.forEach(o => {
            if (o.po_no && String(o.po_no).trim() !== "") poSet.add(String(o.po_no).trim());
        });
        allPOs = Array.from(poSet).sort();
    }

    function filterPODropdown() {
        const input = document.getElementById('input_po_no');
        const dropdown = document.getElementById('smart_dropdown_po');
        const filterText = input.value.toLowerCase().trim();
        
        dropdown.innerHTML = '';
        const matchedPOs = allPOs.filter(po => po.toLowerCase().includes(filterText));
        
        if (matchedPOs.length === 0) {
            dropdown.innerHTML = `<div class="smart-dropdown-item" style="color:#aaa; cursor:default;">ไม่พบข้อมูล PO</div>`;
        } else {
            matchedPOs.slice(0, 30).forEach(po => {
                let displayHtml = po;
                if (filterText !== "") {
                    const regex = new RegExp(`(${filterText})`, "gi");
                    displayHtml = po.replace(regex, `<span class="highlight-match">$1</span>`);
                }
                dropdown.innerHTML += `<div class="smart-dropdown-item" onclick="selectPO('${po}')">${displayHtml}</div>`;
            });
        }
        dropdown.style.display = 'block';
    }

    function selectPO(poNo) {
        document.getElementById('input_po_no').value = poNo;
        document.getElementById('smart_dropdown_po').style.display = 'none';
        fetchAndRenderReport(); 
    }

    function handleEnter(e) { 
        if (e.key === 'Enter') {
            document.getElementById('smart_dropdown_po').style.display = 'none';
            fetchAndRenderReport(); 
        }
    }

    document.addEventListener('click', function(event) {
        const input = document.getElementById('input_po_no');
        const dropdown = document.getElementById('smart_dropdown_po');
        if (event.target !== input && event.target !== dropdown && !dropdown.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });

    function showLoading(show) { 
        document.getElementById('loadingStatus').style.setProperty('display', show ? 'inline-block' : 'none', 'important'); 
    }

    async function fetchAndRenderReport() {
        const searchPO = document.getElementById('input_po_no').value.trim();
        if (!searchPO) return;

        const placeholder = document.getElementById('placeholderText');
        if(placeholder) placeholder.style.display = 'none';
        
        const container = document.getElementById('reportContainer');
        container.innerHTML = ''; 

        const matchedOrders = rawData.orders.filter(o => String(o.po_no).trim().toLowerCase() === searchPO.toLowerCase());
        
        if (matchedOrders.length === 0) {
            container.innerHTML = `<div class="text-center text-danger mt-5 fw-bold">ไม่พบรายการ Order ภายใต้ PO: ${searchPO}</div>`;
            return;
        }

        const orderIds = matchedOrders.map(o => o.id_order);
        const startStr = document.getElementById('input_start_date').value;
        const endStr = document.getElementById('input_end_date').value;

        showLoading(true);
        let dailyData = [];

        try {
            let query = `${SUPABASE_URL}/daily_production?id_order=in.(${orderIds.join(',')})&select=record_date,id_target,produced_amount`;
            if (startStr) query += `&record_date=gte.${startStr}`;
            if (endStr) query += `&record_date=lte.${endStr}`;
            
            const res = await fetch(query, { headers: headers, cache: 'no-store' });
            dailyData = await res.json();
        } catch (error) {
            console.error("Fetch Daily Error:", error);
            container.innerHTML = `<div class="text-danger text-center">เกิดข้อผิดพลาดในการดึงข้อมูล</div>`;
            showLoading(false);
            return;
        }

        matchedOrders.forEach(order => {
            renderOrderTable(order, dailyData, container);
        });

        showLoading(false);
    }

    function renderOrderTable(order, allDailyData, container) {
        let workCode = maps.workIdToCode[order.id_work] || 'ไม่ระบุ';
        let targetQty = Number(order.quantity || 0).toLocaleString();
        let poNo = order.po_no || '-';
        
        let orderDaily = allDailyData.filter(d => d.id_target && rawData.targets.find(t => t.id_target === d.id_target && t.id_work === order.id_work));
        
        let stepIds = Array.from(maps.workIdToStepIds[order.id_work] || []).sort((a, b) => {
            return (maps.stepIdToLevel[a] || 9999) - (maps.stepIdToLevel[b] || 9999);
        });

        let activeDatesSet = new Set();
        orderDaily.forEach(d => { if(d.record_date) activeDatesSet.add(d.record_date.substring(0, 10)); });
        let activeDates = Array.from(activeDatesSet).sort(); 

        if (stepIds.length === 0) return; 

        let stepTotals = {}; 
        stepIds.forEach(id => stepTotals[id] = 0);

        activeDates.forEach(dateStr => {
            stepIds.forEach(stepId => {
                let qty = orderDaily.filter(record => 
                    record.record_date.startsWith(dateStr) && 
                    maps.targetIdToStepId[record.id_target] === stepId
                ).reduce((sum, record) => sum + (record.produced_amount || 0), 0);
                
                stepTotals[stepId] += qty;
            });
        });

        let visibleStepIds = stepIds.filter(id => stepTotals[id] > 0);

        if (visibleStepIds.length === 0) {
            return;
        }

        let html = `
        <div class="report-section">
            <div class="report-header">
                <div class="report-title-text" data-workcode="${workCode}">
                    <span style="font-size: 16pt; color: #555;">PO: <strong style="color: #000;">${poNo}</strong></span> 
                    <span style="color:#ccc; margin:0 10px;">|</span>
                    Order: ${order.order_no} 
                    <span style="color:#ccc; margin:0 10px;">|</span> 
                    <span class="highlight">${workCode}</span> 
                    <span style="font-size:16pt; color:#333; margin-left: 10px;">(ยอดสั่ง <b>${targetQty}</b> ชิ้น)</span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="prod-table">
                    <thead>
                        <tr>
                            <th>วันที่</th>`;
        
        visibleStepIds.forEach(stepId => {
            let stepName = maps.stepIdToName[stepId] || 'ไม่ระบุ';
            html += `<th>${stepName}</th>`;
        });
        html += `       </tr>
                    </thead>
                    <tbody>`;

        activeDates.forEach(dateStr => {
            let [y, m, d] = dateStr.split('-');
            let displayDate = `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;

            html += `<tr><td class="col-date">${displayDate}</td>`;
            
            visibleStepIds.forEach(stepId => {
                let qty = orderDaily.filter(record => 
                    record.record_date.startsWith(dateStr) && 
                    maps.targetIdToStepId[record.id_target] === stepId
                ).reduce((sum, record) => sum + (record.produced_amount || 0), 0);

                if (qty > 0) {
                    html += `<td class="val-cell">${qty.toLocaleString()}</td>`;
                } else {
                    html += `<td class="val-cell val-zero">-</td>`;
                }
            });
            html += `</tr>`;
        });

        html += `   </tbody>
                    <tfoot>
                        <tr>
                            <th style="text-align:center;">ยอดรวมทั้งหมด</th>`;
        visibleStepIds.forEach(stepId => {
            let total = stepTotals[stepId] || 0;
            html += `<th class="val-cell text-primary">${total > 0 ? total.toLocaleString() : '-'}</th>`;
        });
        html += `       </tr>
                    </tfoot>
                </table>
            </div>
        </div>`;

        container.innerHTML += html;
    }

    // ฟังก์ชันส่งออกเป็น Excel (รวมข้อมูล PO ไว้ใน Sheet เดียวกัน)
    function exportToExcel() {
        const poNo = document.getElementById('input_po_no').value.trim() || 'Report';
        const sections = document.querySelectorAll('.report-section');
        
        if (sections.length === 0) {
            alert('ไม่พบข้อมูลตารางสำหรับส่งออก กรุณาค้นหาข้อมูลก่อน'); 
            return;
        }

        // ตัวแปรสำหรับเก็บข้อมูลทั้งหมดเพื่อสร้าง Sheet เดียว
        let combinedData = [];

        sections.forEach((sec, idx) => {
            // ดึงข้อความหัวตาราง
            const titleEl = sec.querySelector('.report-title-text');
            if (titleEl) {
                // จัดรูปแบบข้อความหัวตารางให้เป็น 1 แถวใน Excel
                let titleText = titleEl.innerText.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
                combinedData.push([titleText]);
            }
            
            // ดึงข้อมูลในตาราง
            const table = sec.querySelector('table');
            if (table) {
                const rows = table.querySelectorAll('tr');
                rows.forEach(tr => {
                    let rowData = [];
                    const cells = tr.querySelectorAll('th, td');
                    cells.forEach(cell => {
                        rowData.push(cell.innerText);
                    });
                    combinedData.push(rowData);
                });
            }
            
            // เว้นบรรทัด 2 แถว ระหว่างรหัสชิ้นงานแต่ละตัว
            combinedData.push([]);
            combinedData.push([]);
        });

        // สร้าง Workbook และตั้งชื่อ Sheet
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(combinedData);
        
        // กรองชื่อ Sheet ไม่ให้มีตัวอักษรต้องห้ามของ Excel
        let safeSheetName = poNo.substring(0, 31).replace(/[\\\/\?\*\[\]\:]/g, '_');
        
        XLSX.utils.book_append_sheet(wb, ws, safeSheetName);
        XLSX.writeFile(wb, `JAGUAR_PO_${poNo}_Production.xlsx`);
    }
</script>

</body>
</html>
