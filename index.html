<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR PO PRODUCTION REPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #020a16;
            --panel-bg: rgba(7, 21, 43, 0.95);
            --border-neon: #0088ff;
            --border-dim: #174276;
            --text-main: #e6f0ff;
            --text-label: #8ca8cc;
            --text-muted: #5c7c9e;
            --neon-blue: #00aaff;
            --neon-yellow: #f5a623;
            --neon-green: #00ff88;
            --neon-red: #ff3366;
            --input-bg: #0a1f3d;
            --input-text: #ffffff;
            --table-bg: #051428;
            --table-header-bg: #031022;
            --table-hover-bg: #0c2b54;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(2, 10, 22, 0.95), rgba(5, 15, 30, 0.9));
            z-index: -1;
        }

        /* สำหรับการพิมพ์เอกสาร */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white; color: black; padding: 0; margin: 0; }
            body::before { display: none; }
            .no-print { display: none !important; }
            .report-section {
                border: none !important; background: white !important; color: black !important; box-shadow: none !important;
                page-break-inside: avoid;
                margin-bottom: 20px !important;
            }
            .prod-table { width: 100% !important; border-collapse: collapse !important; font-size: 0.8rem !important; color: black !important; }
            .prod-table th, .prod-table td { border: 1px solid #000 !important; color: black !important; padding: 4px !important; }
            .prod-table th { background-color: #e2e8f0 !important; -webkit-print-color-adjust: exact; }
            .text-neon-yellow { color: #000 !important; font-weight: bold; }
            .val-cell { color: #000 !important; }
        }

        .control-panel {
            background: var(--panel-bg); border: 1px solid var(--border-dim);
            border-radius: 6px; padding: 15px; margin-bottom: 15px;
        }

        .report-section {
            width: 100%; background: var(--table-bg);
            border: 2px solid var(--border-neon); padding: 15px; margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.1); border-radius: 8px;
        }

        .report-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--border-dim); padding-bottom: 10px; margin-bottom: 15px;
        }

        .report-title-text { font-size: 1.1rem; font-weight: bold; color: var(--neon-blue); }
        .report-title-text span.highlight { color: var(--neon-yellow); }

        .table-responsive { width: 100%; overflow-x: auto; }

        .prod-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            border: 1px solid var(--border-dim); font-size: 0.85rem;
        }

        .prod-table th, .prod-table td {
            border-right: 1px solid var(--border-dim); border-bottom: 1px solid var(--border-dim);
            padding: 8px 10px; text-align: right; vertical-align: middle;
        }

        .prod-table th { background-color: var(--table-header-bg); color: var(--neon-blue); font-weight: bold; text-align: center; }
        .prod-table td.col-date { text-align: center; font-weight: bold; color: var(--text-main); background-color: rgba(3, 16, 34, 0.5); }
        .prod-table tr:hover td { background-color: var(--table-hover-bg); }

        .prod-table tfoot th { background-color: #041224; color: var(--neon-green); font-weight: bold; }

        .val-cell { font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.9rem; color: var(--neon-green); }
        .val-zero { color: #1a2a3a; font-weight: normal; } 

        .form-select-neon {
            background-color: var(--input-bg); border: 1px solid var(--border-dim); color: var(--input-text);
            padding: 8px 12px; border-radius: 4px; outline: none; font-size: 0.9rem; width: 100%;
        }
        .form-select-neon:focus { border-color: var(--neon-blue); box-shadow: 0 0 5px rgba(0, 170, 255, 0.4); }
        
        .btn-neon {
            background: #0d2b52; color: var(--text-main); border: 1px solid var(--border-dim);
            padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-neon:hover { background: var(--border-dim); color: #fff; }
        
        .btn-search { background: rgba(0, 170, 255, 0.1); color: var(--neon-blue); border-color: var(--neon-blue); }
        .btn-search:hover { background: var(--neon-blue); color: #000; }
        .btn-print { background: rgba(245, 166, 35, 0.1); color: var(--neon-yellow); border-color: var(--neon-yellow); }
        .btn-print:hover { background: var(--neon-yellow); color: #000; }

        .smart-dropdown-menu {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--input-bg); border: 1px solid var(--neon-blue);
            border-top: none; z-index: 1000; max-height: 250px; overflow-y: auto;
            display: none; border-radius: 0 0 6px 6px; box-shadow: 0 4px 15px rgba(0, 170, 255, 0.2);
        }
        .smart-dropdown-item {
            padding: 10px 12px; color: var(--text-main); cursor: pointer;
            border-bottom: 1px solid rgba(23, 66, 118, 0.5); font-size: 0.85rem;
        }
        .smart-dropdown-item:hover { background: var(--table-hover-bg); color: var(--neon-yellow); }
        .highlight-match { color: var(--neon-green); font-weight: bold; }
    </style>
</head>
<body>

    <div class="control-panel no-print">
        <div class="row align-items-end g-3">
            
            <!-- ช่องค้นหาเลขที่ PO -->
            <div class="col-md-4">
                <label class="form-label text-label mb-1" style="font-size: 0.85rem;">ระบุเลขที่ PO (เพื่อประหยัดโควต้าข้อมูล):</label>
                <div class="input-group position-relative">
                    <input type="text" id="input_po_no" class="form-select-neon form-control" 
                           placeholder="พิมพ์เลขที่ PO..." autocomplete="off"
                           onkeyup="filterPODropdown()" onfocus="filterPODropdown()" onkeydown="handleEnter(event)">
                    <button class="btn btn-neon btn-search" onclick="fetchAndRenderReport()">
                        <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
                    </button>
                    <div id="smart_dropdown_po" class="smart-dropdown-menu"></div>
                </div>
            </div>
            
            <!-- ช่องช่วงวันที่ -->
            <div class="col-md-4">
                <label class="form-label text-label mb-1" style="font-size: 0.85rem;">ช่วงวันที่แสดงผล:</label>
                <div class="d-flex gap-2">
                    <div class="input-group">
                        <input type="date" id="input_start_date" class="form-select-neon form-control px-2">
                        <span class="input-group-text" style="background: var(--input-bg); color: var(--text-muted); border-color: var(--border-dim);">-</span>
                        <input type="date" id="input_end_date" class="form-select-neon form-control px-2">
                    </div>
                </div>
            </div>
            
            <!-- โซนปุ่มควบคุม -->
            <div class="col-md-4 text-end">
                <div id="loadingStatus" class="d-inline-block text-neon-blue me-3" style="display: none !important;">
                    <i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...
                </div>
                <button class="btn btn-neon btn-print" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> พิมพ์รายงาน
                </button>
            </div>
        </div>
    </div>

    <!-- พื้นที่แสดงรายงาน (ตารางจะถูก Gen ลงในนี้) -->
    <div id="reportContainer">
        <div class="text-center text-muted mt-5" id="placeholderText">
            <i class="fa-solid fa-file-invoice fs-1 mb-3 opacity-50"></i><br>
            กรุณาระบุเลขที่ PO และกดค้นหา เพื่อดูรายงานยอดผลิต
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json", "Prefer": "return=minimal" 
    };

    // เก็บข้อมูลพื้นฐาน (ยกเว้น Daily Production ที่จะโหลดทีหลัง)
    let rawData = { orders: [], workItems: [], steps: [], targets: [] };
    let maps = { workIdToCode: {}, stepIdToName: {}, stepIdToLevel: {}, targetIdToStepId: {}, workIdToStepIds: {} };
    let allPOs = [];

    window.onload = async function() {
        setDefaultDates(); 
        showLoading(true);
        await fetchBaseData();
        setupPOList(); 
        showLoading(false);
    };

    function setDefaultDates() {
        let today = new Date();
        let startDate = new Date();
        startDate.setDate(today.getDate() - 30); // ย้อนหลัง 1 เดือน 
        
        document.getElementById('input_start_date').value = startDate.toISOString().substring(0, 10);
        document.getElementById('input_end_date').value = today.toISOString().substring(0, 10);
    }

    // 1. ดึงข้อมูลพื้นฐานเพื่อทำตัวกรอง (ประหยัดโควต้า)
    async function fetchBaseData() {
        try {
            const endpoints = [
                `${SUPABASE_URL}/orders?select=id_order,order_no,po_no,id_work,quantity`,
                `${SUPABASE_URL}/work_items?select=id_work,work_code`,
                `${SUPABASE_URL}/production_steps?select=id_step,step_name,level`,
                `${SUPABASE_URL}/targets?select=id_target,id_step,id_work`
            ];
            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers, cache: 'no-store' })));
            const data = await Promise.all(responses.map(res => res.json()));
            
            rawData = { orders: data[0], workItems: data[1], steps: data[2], targets: data[3] };
            buildMaps();
        } catch (error) { console.error("Error Fetching Base Data:", error); }
    }

    function buildMaps() {
        maps.workIdToCode = {}; rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);
        
        maps.stepIdToName = {}; 
        maps.stepIdToLevel = {}; 
        rawData.steps.forEach(s => {
            maps.stepIdToName[s.id_step] = s.step_name;
            maps.stepIdToLevel[s.id_step] = parseInt(s.level) || 9999; 
        });

        maps.targetIdToStepId = {}; maps.workIdToStepIds = {};
        rawData.targets.forEach(t => {
            maps.targetIdToStepId[t.id_target] = t.id_step;
            if(!maps.workIdToStepIds[t.id_work]) maps.workIdToStepIds[t.id_work] = new Set();
            maps.workIdToStepIds[t.id_work].add(t.id_step);
        });
    }

    // ระบบ Dropdown สำหรับ PO
    function setupPOList() {
        let poSet = new Set();
        rawData.orders.forEach(o => {
            if (o.po_no && String(o.po_no).trim() !== "") poSet.add(String(o.po_no).trim());
        });
        allPOs = Array.from(poSet).sort();
    }

    function filterPODropdown() {
        const input = document.getElementById('input_po_no');
        const dropdown = document.getElementById('smart_dropdown_po');
        const filterText = input.value.toLowerCase().trim();
        
        dropdown.innerHTML = '';
        const matchedPOs = allPOs.filter(po => po.toLowerCase().includes(filterText));
        
        if (matchedPOs.length === 0) {
            dropdown.innerHTML = `<div class="smart-dropdown-item" style="color:var(--text-muted); cursor:default;">ไม่พบข้อมูล PO</div>`;
        } else {
            matchedPOs.slice(0, 30).forEach(po => {
                let displayHtml = po;
                if (filterText !== "") {
                    const regex = new RegExp(`(${filterText})`, "gi");
                    displayHtml = po.replace(regex, `<span class="highlight-match">$1</span>`);
                }
                dropdown.innerHTML += `<div class="smart-dropdown-item" onclick="selectPO('${po}')">${displayHtml}</div>`;
            });
        }
        dropdown.style.display = 'block';
    }

    function selectPO(poNo) {
        document.getElementById('input_po_no').value = poNo;
        document.getElementById('smart_dropdown_po').style.display = 'none';
        fetchAndRenderReport(); 
    }

    function handleEnter(e) { 
        if (e.key === 'Enter') {
            document.getElementById('smart_dropdown_po').style.display = 'none';
            fetchAndRenderReport(); 
        }
    }

    document.addEventListener('click', function(event) {
        const input = document.getElementById('input_po_no');
        const dropdown = document.getElementById('smart_dropdown_po');
        if (event.target !== input && event.target !== dropdown && !dropdown.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });

    function showLoading(show) { 
        document.getElementById('loadingStatus').style.setProperty('display', show ? 'inline-block' : 'none', 'important'); 
    }

    // 2. ดึงข้อมูล Daily เฉพาะ PO ที่ค้นหา และสร้างตาราง
    async function fetchAndRenderReport() {
        const searchPO = document.getElementById('input_po_no').value.trim();
        if (!searchPO) return;

        document.getElementById('placeholderText').style.display = 'none';
        const container = document.getElementById('reportContainer');
        container.innerHTML = ''; // Clear old data

        // หาออเดอร์ทั้งหมดที่ตรงกับ PO นี้
        const matchedOrders = rawData.orders.filter(o => String(o.po_no).trim().toLowerCase() === searchPO.toLowerCase());
        
        if (matchedOrders.length === 0) {
            container.innerHTML = `<div class="text-center text-neon-red mt-5"><i class="fa-solid fa-circle-exclamation fs-2 mb-2"></i><br>ไม่พบรายการ Order ภายใต้ PO: ${searchPO}</div>`;
            return;
        }

        const orderIds = matchedOrders.map(o => o.id_order);
        const startStr = document.getElementById('input_start_date').value;
        const endStr = document.getElementById('input_end_date').value;

        showLoading(true);
        let dailyData = [];

        try {
            // ดึงข้อมูล Daily Production แบบจำกัดแค่ Order ID ที่เจอ และอยู่ในช่วงวันที่
            let query = `${SUPABASE_URL}/daily_production?id_order=in.(${orderIds.join(',')})&select=record_date,id_target,produced_amount`;
            if (startStr) query += `&record_date=gte.${startStr}`;
            if (endStr) query += `&record_date=lte.${endStr}`;
            
            const res = await fetch(query, { headers: headers, cache: 'no-store' });
            dailyData = await res.json();
        } catch (error) {
            console.error("Fetch Daily Error:", error);
            container.innerHTML = `<div class="text-danger">เกิดข้อผิดพลาดในการดึงข้อมูล</div>`;
            showLoading(false);
            return;
        }

        // 3. วนลูปสร้างตารางแยกตามแต่ละออเดอร์ (รหัสชิ้นงาน)
        matchedOrders.forEach(order => {
            renderOrderTable(order, dailyData, container);
        });

        showLoading(false);
    }

    function renderOrderTable(order, allDailyData, container) {
        let workCode = maps.workIdToCode[order.id_work] || 'ไม่ระบุ';
        let targetQty = Number(order.quantity || 0).toLocaleString();
        
        // กรองข้อมูลเฉพาะออเดอร์นี้
        let orderDaily = allDailyData.filter(d => d.id_target && rawData.targets.find(t => t.id_target === d.id_target && t.id_work === order.id_work));
        
        // หาขั้นตอนทั้งหมดของสินค้านี้ และเรียงตาม Level
        let stepIds = Array.from(maps.workIdToStepIds[order.id_work] || []).sort((a, b) => {
            return (maps.stepIdToLevel[a] || 9999) - (maps.stepIdToLevel[b] || 9999);
        });

        // หาวันที่ที่มีการคีย์งานจริง เพื่อนำมาสร้างเป็น Row แถวแนวตั้ง
        let activeDatesSet = new Set();
        orderDaily.forEach(d => { if(d.record_date) activeDatesSet.add(d.record_date.substring(0, 10)); });
        let activeDates = Array.from(activeDatesSet).sort(); // เรียงวันที่น้อยไปมาก

        if (stepIds.length === 0) return; // ถ้าไม่มีขั้นตอนข้ามไป

        // สร้าง HTML สำหรับตารางนี้
        let html = `
        <div class="report-section">
            <div class="report-header">
                <div class="report-title-text">
                    ${order.order_no} <span style="color:var(--text-muted); margin:0 10px;">|</span> 
                    <span class="highlight">${workCode}</span> 
                    <span style="font-size:0.9rem; color:var(--text-main); margin-left: 10px;">ยอดสั่ง <span style="color:var(--neon-green);">${targetQty}</span> ชิ้น</span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="prod-table">
                    <thead>
                        <tr>
                            <th style="width: 120px; text-align:center;">วันที่</th>`;
        
        // สร้างหัวคอลัมน์ (ขั้นตอน)
        stepIds.forEach(stepId => {
            let stepName = maps.stepIdToName[stepId] || 'ไม่ระบุ';
            html += `<th>${stepName}</th>`;
        });
        html += `       </tr>
                    </thead>
                    <tbody>`;

        let stepTotals = {}; // เก็บยอดรวมของแต่ละคอลัมน์
        stepIds.forEach(id => stepTotals[id] = 0);

        if (activeDates.length === 0) {
            html += `<tr><td colspan="${stepIds.length + 1}" style="text-align:center; color:var(--text-muted);">ไม่มีประวัติการผลิตในช่วงวันที่เลือก</td></tr>`;
        } else {
            // สร้างข้อมูลแต่ละแถว (ตามวันที่)
            activeDates.forEach(dateStr => {
                let [y, m, d] = dateStr.split('-');
                let displayDate = `${d}/${m}/${y}`; // Format: 18/8/2026

                html += `<tr><td class="col-date">${displayDate}</td>`;
                
                stepIds.forEach(stepId => {
                    // หายอดรวมของขั้นตอนนี้ ในวันนี้
                    let qtyForStepAndDate = orderDaily.filter(record => 
                        record.record_date.startsWith(dateStr) && 
                        maps.targetIdToStepId[record.id_target] === stepId
                    ).reduce((sum, record) => sum + (record.produced_amount || 0), 0);

                    stepTotals[stepId] += qtyForStepAndDate;

                    if (qtyForStepAndDate > 0) {
                        html += `<td class="val-cell">${qtyForStepAndDate.toLocaleString()}</td>`;
                    } else {
                        html += `<td class="val-cell val-zero">-</td>`;
                    }
                });
                html += `</tr>`;
            });
        }

        // สร้างแถวสรุปยอดรวม (Total) ด้านล่าง
        html += `   </tbody>
                    <tfoot>
                        <tr>
                            <th style="text-align:center;">ยอดรวมทั้งหมด</th>`;
        stepIds.forEach(stepId => {
            let total = stepTotals[stepId] || 0;
            html += `<th class="val-cell" style="color: var(--neon-yellow);">${total > 0 ? total.toLocaleString() : '-'}</th>`;
        });
        html += `       </tr>
                    </tfoot>
                </table>
            </div>
        </div>`;

        container.innerHTML += html;
    }
</script>

</body>
</html>
